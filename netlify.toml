# Coloque o site (index.html) na mesma pasta deste arquivo.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Deixa a chamada do site curta: o site pode usar asaasEndpoint = "/api/criar-link"
[[redirects]]
  from = "/api/criar-link"
  to = "/.netlify/functions/criar-link-pagamento"
  status = 200

[[redirects]]
  from = "/api/asaas-webhook"
  to = "/.netlify/functions/asaas-webhook"
  status = 200
